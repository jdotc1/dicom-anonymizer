name: Manually authorized synthetic tests

on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: 'I authorize this specific synthetic test run after checking existing evidence.'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: synthetic-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  engine-tests:
    if: ${{ inputs.acknowledge }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ['3.10', '3.13']
    steps:
      # Pins stay on release tags: a commit SHA could not be verified offline.
      # Replace each tag with its 40-hex commit SHA and keep the tag as a comment.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned dependency
        run: python -B -m pip install -r requirements.txt
      - name: Run synthetic unit tests
        env:
          DICOM_TEST_TIMEOUT_SCALE: '3'
        run: |
          export DICOM_TEST_TMPDIR="$RUNNER_TEMP/dicom-tests"
          mkdir -p "$DICOM_TEST_TMPDIR"
          python -B -m unittest discover -s tests -v
