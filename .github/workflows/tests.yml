name: Manually authorized synthetic tests

on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: 'I authorize this specific synthetic test run after checking existing evidence.'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  engine-tests:
    if: ${{ inputs.acknowledge }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned dependency
        run: python -m pip install -r requirements.txt
      - name: Run synthetic unit tests
        run: python -m unittest discover -s tests -v
